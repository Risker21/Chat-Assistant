<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpeg" href="/img/favicon.jpg">
    <title>解忧小铺 · AI 智能助手</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <!-- Markdown + Sanitizer + Syntax Highlighting -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.9/purify.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <!-- KaTeX for Math Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            bg: '#0b0d17',
                            surface: '#121526',
                            card: '#191d32',
                            border: '#272c46',
                            text: '#e5e7eb',
                        },
                    },
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'sans-serif'],
                    },
                },
            },
        };
    </script>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="bg-slate-50 dark:bg-dark-bg text-slate-800 dark:text-dark-text h-screen overflow-hidden flex transition-colors duration-300">

    <!-- Ambient Subtle Background -->
    <div class="fixed inset-0 -z-10 pointer-events-none overflow-hidden">
        <div class="absolute -top-24 left-1/4 w-[28rem] h-[28rem] bg-violet-400/15 dark:bg-violet-600/10 rounded-full blur-3xl"></div>
        <div class="absolute bottom-0 right-1/4 w-[24rem] h-[24rem] bg-indigo-400/15 dark:bg-indigo-600/10 rounded-full blur-3xl"></div>
    </div>

    <!-- Mobile Sidebar Backdrop -->
    <div id="sidebar-backdrop" class="fixed inset-0 bg-black/40 backdrop-blur-xs z-30 hidden lg:hidden"></div>

    <!-- Left Sidebar -->
    <aside id="sidebar" class="app-sidebar fixed lg:static inset-y-0 left-0 z-40 -translate-x-full lg:translate-x-0 flex flex-col bg-white/95 dark:bg-dark-surface/95 border-r border-slate-200/80 dark:border-dark-border shrink-0">
        <!-- Brand & New Chat -->
        <div class="p-4 border-b border-slate-200/70 dark:border-dark-border">
            <div class="flex items-center justify-between mb-3.5">
                <div class="flex items-center gap-2.5 min-w-0">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-violet-500 to-indigo-600 flex items-center justify-center shadow-md shadow-violet-500/25 shrink-0">
                        <i class="fa-solid fa-sparkles text-white text-sm"></i>
                    </div>
                    <div class="min-w-0">
                        <h1 class="text-base font-bold bg-clip-text text-transparent bg-gradient-to-r from-violet-600 to-indigo-600 dark:from-violet-400 dark:to-indigo-400 truncate">
                            解忧小铺
                        </h1>
                        <p class="text-[11px] text-slate-400 dark:text-slate-500 -mt-0.5 truncate">多模型 AI 智能助手</p>
                    </div>
                </div>
                <button id="sidebar-close-mobile" class="lg:hidden w-8 h-8 rounded-lg flex items-center justify-center text-slate-400 hover:bg-slate-100 dark:hover:bg-dark-card">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <button id="new-chat-btn" type="button" class="w-full py-2.5 px-3.5 rounded-xl bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-700 hover:to-indigo-700 text-white text-sm font-medium flex items-center justify-center gap-2 shadow-sm shadow-violet-500/25 transition-all active:scale-[0.98]">
                <i class="fa-solid fa-plus text-xs"></i>
                <span>新建对话</span>
                <span class="ml-auto text-[10px] bg-white/20 px-1.5 py-0.5 rounded hidden sm:inline">Ctrl K</span>
            </button>

            <div class="relative mt-3">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-xs text-slate-400"></i>
                <input id="conv-search-input" type="text" placeholder="搜索历史对话..." class="w-full pl-8 pr-3 py-1.5 text-xs rounded-lg bg-slate-100/80 dark:bg-dark-card border border-transparent focus:border-violet-400 focus:bg-white dark:focus:bg-dark-card focus:outline-none transition-colors">
            </div>
        </div>

        <!-- Conversation List -->
        <div id="conversation-list" class="flex-1 overflow-y-auto px-2.5 py-3 space-y-4 scrollbar-custom">
            <!-- Populated dynamically -->
        </div>

        <!-- Sidebar Footer -->
        <div class="p-3 border-t border-slate-200/70 dark:border-dark-border space-y-1.5">
            <div class="flex items-center gap-1.5">
                <button id="open-persona-studio-btn" type="button" class="flex-1 px-3 py-2 rounded-xl text-xs font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-dark-card flex items-center gap-2 transition-colors">
                    <i class="fa-solid fa-masks-theater text-violet-500"></i>
                    <span>角色工坊</span>
                </button>
                <button id="open-settings-btn" type="button" class="px-3 py-2 rounded-xl text-xs font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-dark-card flex items-center gap-1.5 transition-colors" title="对话参数与模型状态">
                    <i class="fa-solid fa-sliders text-slate-400"></i>
                    <span>设置</span>
                </button>
                <button id="clear-all-convs-btn" type="button" class="w-8 h-8 rounded-xl text-slate-400 hover:text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-950/30 flex items-center justify-center transition-colors" title="清空全部会话">
                    <i class="fa-regular fa-trash-can text-xs"></i>
                </button>
            </div>

            <!-- User / Guest Account Bar -->
            <div class="flex items-center justify-between gap-2 p-2 rounded-xl bg-slate-100/80 dark:bg-dark-card/90 border border-slate-200/60 dark:border-dark-border">
                <button id="user-account-btn" type="button" class="flex items-center gap-2.5 min-w-0 flex-1 text-left">
                    <div id="user-avatar" class="w-8 h-8 rounded-lg bg-gradient-to-br from-slate-400 to-slate-500 text-white flex items-center justify-center text-xs font-bold shrink-0">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <div class="min-w-0">
                        <div id="user-display-name" class="text-xs font-semibold text-slate-700 dark:text-slate-200 truncate">游客体验模式</div>
                        <div id="user-status-label" class="text-[10px] text-violet-600 dark:text-violet-400 truncate">点击登录同步历史</div>
                    </div>
                </button>
                <button id="logout-btn" type="button" class="hidden w-7 h-7 rounded-lg text-slate-400 hover:text-rose-500 hover:bg-white dark:hover:bg-dark-surface flex items-center justify-center transition-colors" title="退出登录">
                    <i class="fa-solid fa-right-from-bracket text-xs"></i>
                </button>
            </div>
        </div>
    </aside>

    <!-- Main Workspace -->
    <div class="flex-1 flex flex-col min-w-0 h-full relative">
        <!-- Top Header -->
        <header class="glass sticky top-0 z-20 border-b border-slate-200/70 dark:border-dark-border px-3 sm:px-5 py-2.5 flex items-center justify-between gap-2">
            <div class="flex items-center gap-2 min-w-0">
                <button id="sidebar-toggle-btn" type="button" class="w-9 h-9 rounded-xl flex items-center justify-center text-slate-500 hover:text-violet-600 hover:bg-slate-100 dark:hover:bg-dark-card transition-colors shrink-0" title="展开/收起侧边栏">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="min-w-0 hidden md:block">
                    <h2 id="active-conv-title" class="text-sm font-semibold text-slate-700 dark:text-slate-200 truncate max-w-[220px]">新对话</h2>
                </div>
            </div>

            <!-- Persona & Model Selectors -->
            <div class="flex items-center gap-2 flex-wrap justify-end">
                <div class="flex items-center bg-white dark:bg-dark-card rounded-xl px-2.5 py-1 border border-slate-200 dark:border-dark-border shadow-xs">
                    <i class="fa-solid fa-masks-theater text-violet-500 text-xs mr-1.5"></i>
                    <select id="persona-select" class="bg-transparent text-xs sm:text-sm font-medium text-slate-700 dark:text-slate-100 focus:outline-none cursor-pointer pr-1" title="选择对话角色">
                    </select>
                </div>

                <div class="flex items-center bg-white dark:bg-dark-card rounded-xl px-2.5 py-1 border border-slate-200 dark:border-dark-border shadow-xs">
                    <span id="model-status-dot" class="w-2 h-2 rounded-full bg-emerald-400 mr-1.5 shrink-0" title="模型状态"></span>
                    <select id="model-select" class="bg-transparent text-xs sm:text-sm font-medium text-slate-700 dark:text-slate-100 focus:outline-none cursor-pointer pr-1" title="选择底层模型">
                    </select>
                </div>

                <!-- Export & Theme -->
                <div class="flex items-center gap-1 border-l border-slate-200 dark:border-dark-border pl-2">
                    <button id="export-md-btn" type="button" class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-500 hover:text-violet-600 hover:bg-slate-100 dark:hover:bg-dark-card transition-colors" title="导出为 Markdown">
                        <i class="fa-solid fa-file-arrow-down text-sm"></i>
                    </button>
                    <button id="export-json-btn" type="button" class="w-8 h-8 rounded-lg hidden sm:flex items-center justify-center text-slate-500 hover:text-violet-600 hover:bg-slate-100 dark:hover:bg-dark-card transition-colors" title="导出为 JSON">
                        <i class="fa-solid fa-code text-sm"></i>
                    </button>
                    <button id="theme-toggle" type="button" class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-500 hover:text-violet-600 hover:bg-slate-100 dark:hover:bg-dark-card transition-colors" title="切换亮色/暗色主题">
                        <i class="fa-solid fa-moon text-sm"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Toast Container -->
        <div id="toast-container" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 pointer-events-none"></div>

        <!-- Scroll to Bottom Floating Button -->
        <button id="scroll-bottom-btn" type="button" class="absolute bottom-36 right-6 w-10 h-10 bg-white dark:bg-dark-card rounded-full shadow-lg border border-slate-200 dark:border-dark-border flex items-center justify-center text-violet-600 hover:scale-105 transition-all opacity-0 invisible z-20" title="回到底部">
            <i class="fa-solid fa-arrow-down text-sm"></i>
        </button>

        <!-- Chat Messages Container -->
        <main id="chat-history" class="flex-1 overflow-y-auto px-3 sm:px-6 py-6 scrollbar-custom">
            <div class="max-w-3xl mx-auto w-full">
                <!-- Dynamic Welcome Screen -->
                <div id="welcome-screen" class="flex flex-col items-center justify-center min-h-[58vh] text-center py-6">
                    <div id="welcome-avatar" class="w-20 h-20 rounded-3xl bg-gradient-to-br from-amber-500 to-orange-500 flex items-center justify-center shadow-xl shadow-violet-500/20 mb-5">
                        <i id="welcome-icon" class="fa-solid fa-comments text-white text-3xl"></i>
                    </div>
                    <h2 id="welcome-title" class="text-2xl sm:text-3xl font-bold text-slate-800 dark:text-white mb-2">
                        Zoe · 暖心搭子
                    </h2>
                    <p id="welcome-greeting" class="text-sm sm:text-base text-slate-500 dark:text-slate-400 max-w-lg mb-8 leading-relaxed">
                        嗨，我是 Zoe！今天有没有什么开心或者吐槽的事想跟我分享呀？
                    </p>
                    <div id="welcome-starters" class="grid grid-cols-1 sm:grid-cols-2 gap-3 w-full">
                        <!-- Starter cards rendered dynamically -->
                    </div>
                </div>

                <!-- Messages Feed -->
                <div id="messages-list" class="space-y-6 pb-4"></div>
            </div>
        </main>

        <!-- Composer Footer -->
        <footer class="px-3 sm:px-6 pb-4 pt-2 bg-gradient-to-t from-slate-50 via-slate-50/95 to-transparent dark:from-dark-bg dark:via-dark-bg/95">
            <div class="max-w-3xl mx-auto">
                <form id="chat-form" class="bg-white dark:bg-dark-card rounded-2xl shadow-lg shadow-slate-200/60 dark:shadow-none border border-slate-200/90 dark:border-dark-border transition-all focus-within:ring-2 focus-within:ring-violet-500/40 focus-within:border-violet-400">
                    <!-- Image Attachment Preview -->
                    <div id="image-preview-container" class="hidden px-4 pt-3">
                        <div id="image-preview-list" class="flex flex-wrap gap-2"></div>
                    </div>

                    <textarea
                        id="message-input"
                        rows="1"
                        placeholder="输入消息，支持粘贴或拖拽图片，Enter 发送 / Shift+Enter 换行..."
                        class="w-full bg-transparent px-4 pt-3.5 pb-2 max-h-44 min-h-[52px] resize-none focus:outline-none text-sm sm:text-[15px] text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 scrollbar-custom leading-relaxed"
                    ></textarea>

                    <!-- Composer Toolbar -->
                    <div class="flex items-center justify-between gap-2 px-3 pb-2.5 pt-1">
                        <div class="flex items-center gap-1.5 flex-wrap">
                            <input type="file" id="image-input" accept="image/*" multiple class="hidden">
                            <button type="button" id="image-btn" class="h-8 px-2.5 rounded-lg text-xs font-medium text-slate-500 dark:text-slate-400 hover:text-violet-600 hover:bg-slate-100 dark:hover:bg-dark-surface flex items-center gap-1.5 transition-colors" title="上传图片（支持视觉理解与改图）">
                                <i class="fa-regular fa-image"></i>
                                <span class="hidden sm:inline">图片</span>
                            </button>

                            <button type="button" id="web-search-toggle" class="h-8 px-2.5 rounded-lg text-xs font-medium text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-dark-surface flex items-center gap-1.5 transition-colors border border-transparent" title="切换联网搜索模式（自动 / 强制开启 / 关闭）">
                                <i class="fa-solid fa-globe"></i>
                                <span id="web-search-label">联网: 自动</span>
                            </button>

                            <button type="button" id="image-mode-toggle" class="h-8 px-2.5 rounded-lg text-xs font-medium text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-dark-surface flex items-center gap-1.5 transition-colors border border-transparent" title="切换 AI 绘图模式">
                                <i class="fa-solid fa-wand-magic-sparkles"></i>
                                <span id="image-mode-label">绘图: 自动</span>
                            </button>
                        </div>

                        <div class="flex items-center gap-2 shrink-0">
                            <span id="char-count" class="text-[11px] text-slate-400 hidden sm:inline"></span>
                            <button type="button" id="stop-btn" class="hidden h-9 px-3 rounded-xl bg-rose-50 hover:bg-rose-100 dark:bg-rose-950/40 dark:hover:bg-rose-900/50 text-rose-600 dark:text-rose-400 text-xs font-medium flex items-center gap-1.5 border border-rose-200 dark:border-rose-800/60 transition-colors" title="停止生成">
                                <i class="fa-solid fa-stop"></i>
                                <span>停止</span>
                            </button>
                            <button type="submit" id="send-btn" disabled class="w-9 h-9 rounded-xl bg-gradient-to-br from-violet-600 to-indigo-600 hover:from-violet-700 hover:to-indigo-700 text-white flex items-center justify-center shadow-sm shadow-violet-500/30 disabled:opacity-40 disabled:cursor-not-allowed transition-all active:scale-95" title="发送 (Enter)">
                                <i class="fa-solid fa-arrow-up text-sm"></i>
                            </button>
                        </div>
                    </div>
                </form>
                <p class="text-center mt-2 text-[11px] text-slate-400 dark:text-slate-500">
                    AI 生成内容仅供参考，请核查重要信息 · 会话已自动本地持久化
                </p>
            </div>
        </footer>
    </div>

    <!-- Modal: Auth (Login / Register) -->
    <div id="auth-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 backdrop-blur-xs p-4">
        <div class="bg-white dark:bg-dark-surface w-full max-w-md rounded-2xl shadow-2xl border border-slate-200 dark:border-dark-border overflow-hidden animate-fade-in-up">
            <div class="flex items-center justify-between px-6 py-4 border-b border-slate-200 dark:border-dark-border">
                <h3 class="text-base font-bold text-slate-800 dark:text-white">账号登录 / 注册</h3>
                <button id="auth-modal-close" type="button" class="w-8 h-8 rounded-lg text-slate-400 hover:bg-slate-100 dark:hover:bg-dark-card flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="p-6">
                <div class="flex p-1 rounded-xl bg-slate-100 dark:bg-dark-card mb-5">
                    <button id="auth-tab-login" type="button" class="flex-1 py-2 text-sm font-semibold rounded-lg bg-white dark:bg-dark-surface text-violet-600 shadow-xs transition-all">登录</button>
                    <button id="auth-tab-register" type="button" class="flex-1 py-2 text-sm font-semibold rounded-lg text-slate-500 dark:text-slate-400 transition-all">注册新账号</button>
                </div>

                <div class="mb-4 px-3 py-2 rounded-xl bg-violet-50 dark:bg-violet-950/30 text-xs text-violet-700 dark:text-violet-300 flex items-center gap-2">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <span>登录或注册后，当前游客模式下的对话和自定义角色会自动迁移到您的账号中。</span>
                </div>

                <form id="auth-form" class="space-y-3.5">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 dark:text-slate-300 mb-1">用户名</label>
                        <input id="auth-username" type="text" required minlength="3" maxlength="32" placeholder="3-32位字母/数字/下划线" class="w-full px-3.5 py-2.5 text-sm rounded-xl bg-slate-50 dark:bg-dark-card border border-slate-200 dark:border-dark-border focus:border-violet-500 focus:outline-none">
                    </div>
                    <div id="auth-display-name-wrap" class="hidden">
                        <label class="block text-xs font-medium text-slate-600 dark:text-slate-300 mb-1">昵称（可选）</label>
                        <input id="auth-display-name" type="text" maxlength="64" placeholder="展示在侧边栏的昵称" class="w-full px-3.5 py-2.5 text-sm rounded-xl bg-slate-50 dark:bg-dark-card border border-slate-200 dark:border-dark-border focus:border-violet-500 focus:outline-none">
                    </div>
                    <div id="auth-email-wrap" class="hidden">
                        <label class="block text-xs font-medium text-slate-600 dark:text-slate-300 mb-1">邮箱（可选）</label>
                        <input id="auth-email" type="email" maxlength="128" placeholder="example@domain.com" class="w-full px-3.5 py-2.5 text-sm rounded-xl bg-slate-50 dark:bg-dark-card border border-slate-200 dark:border-dark-border focus:border-violet-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 dark:text-slate-300 mb-1">密码</label>
                        <input id="auth-password" type="password" required minlength="6" maxlength="128" placeholder="至少 6 位密码" class="w-full px-3.5 py-2.5 text-sm rounded-xl bg-slate-50 dark:bg-dark-card border border-slate-200 dark:border-dark-border focus:border-violet-500 focus:outline-none">
                    </div>
                    <p id="auth-error" class="hidden text-xs text-rose-500"></p>
                    <button id="auth-submit-btn" type="submit" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-700 hover:to-indigo-700 text-white text-sm font-semibold shadow-sm transition-all">
                        立即登录
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal: Persona Studio -->
    <div id="persona-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 backdrop-blur-xs p-4">
        <div class="bg-white dark:bg-dark-surface w-full max-w-4xl max-h-[88vh] rounded-2xl shadow-2xl border border-slate-200 dark:border-dark-border flex flex-col overflow-hidden animate-fade-in-up">
            <div class="flex items-center justify-between px-6 py-4 border-b border-slate-200 dark:border-dark-border">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-masks-theater text-violet-500"></i>
                    <h3 class="text-base font-bold text-slate-800 dark:text-white">角色工坊 · Persona Studio</h3>
                </div>
                <button id="persona-modal-close" type="button" class="w-8 h-8 rounded-lg text-slate-400 hover:bg-slate-100 dark:hover:bg-dark-card flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="flex-1 overflow-y-auto grid grid-cols-1 md:grid-cols-2 divide-y md:divide-y-0 md:divide-x divide-slate-200 dark:divide-dark-border scrollbar-custom">
                <!-- Existing Personas -->
                <div class="p-5 space-y-3">
                    <div class="text-xs font-semibold uppercase tracking-wider text-slate-400">全部角色（点击直接启用）</div>
                    <div id="persona-list" class="space-y-2.5"></div>
                </div>

                <!-- Create / Edit Custom Persona -->
                <div class="p-5">
                    <div class="flex items-center justify-between mb-3">
                        <h4 id="persona-form-title" class="text-sm font-bold text-slate-800 dark:text-white">创建自定义角色</h4>
                        <button id="persona-reset-btn" type="button" class="text-xs text-slate-400 hover:text-violet-600">重置表单</button>
                    </div>
                    <form id="persona-form" class="space-y-3">
                        <input type="hidden" id="persona-edit-id" value="">
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-medium text-slate-600 dark:text-slate-300 mb-1">角色名称</label>
                                <input id="persona-name" type="text" required maxlength="64" placeholder="如：架构师老王" class="w-full px-3 py-2 text-sm rounded-xl bg-slate-50 dark:bg-dark-card border border-slate-200 dark:border-dark-border focus:border-violet-500 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-600 dark:text-slate-300 mb-1">头衔标签</label>
                                <input id="persona-title" type="text" required maxlength="64" placeholder="如：后端专家" class="w-full px-3 py-2 text-sm rounded-xl bg-slate-50 dark:bg-dark-card border border-slate-200 dark:border-dark-border focus:border-violet-500 focus:outline-none">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-medium text-slate-600 dark:text-slate-300 mb-1">默认模型</label>
                            <select id="persona-model" class="w-full px-3 py-2 text-sm rounded-xl bg-slate-50 dark:bg-dark-card border border-slate-200 dark:border-dark-border focus:border-violet-500 focus:outline-none"></select>
                        </div>

                        <div>
                            <label class="block text-xs font-medium text-slate-600 dark:text-slate-300 mb-1">角色简介</label>
                            <input id="persona-desc" type="text" maxlength="500" placeholder="一句话介绍角色擅长什么" class="w-full px-3 py-2 text-sm rounded-xl bg-slate-50 dark:bg-dark-card border border-slate-200 dark:border-dark-border focus:border-violet-500 focus:outline-none">
                        </div>

                        <div>
                            <label class="block text-xs font-medium text-slate-600 dark:text-slate-300 mb-1">系统提示词 (System Prompt)</label>
                            <textarea id="persona-prompt" required rows="5" maxlength="4000" placeholder="定义角色的身份、性格、回答风格和专业规则..." class="w-full px-3 py-2 text-sm rounded-xl bg-slate-50 dark:bg-dark-card border border-slate-200 dark:border-dark-border focus:border-violet-500 focus:outline-none resize-none"></textarea>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-medium text-slate-600 dark:text-slate-300 mb-1">图标</label>
                                <select id="persona-icon-picker" class="w-full px-3 py-2 text-sm rounded-xl bg-slate-50 dark:bg-dark-card border border-slate-200 dark:border-dark-border focus:outline-none">
                                    <option value="fa-sparkles">✨ 灵感</option>
                                    <option value="fa-code">💻 编程</option>
                                    <option value="fa-graduation-cap">🎓 导师</option>
                                    <option value="fa-pen-nib">✍️ 写作</option>
                                    <option value="fa-briefcase">💼 职场</option>
                                    <option value="fa-language">🌍 翻译</option>
                                    <option value="fa-robot">🤖 助手</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-600 dark:text-slate-300 mb-1">主题配色</label>
                                <select id="persona-gradient-picker" class="w-full px-3 py-2 text-sm rounded-xl bg-slate-50 dark:bg-dark-card border border-slate-200 dark:border-dark-border focus:outline-none">
                                    <option value="bg-gradient-to-br from-violet-500 to-indigo-600">紫罗兰</option>
                                    <option value="bg-gradient-to-br from-blue-500 to-cyan-500">深海蓝</option>
                                    <option value="bg-gradient-to-br from-emerald-500 to-teal-600">翡翠绿</option>
                                    <option value="bg-gradient-to-br from-amber-500 to-orange-500">暖阳橙</option>
                                    <option value="bg-gradient-to-br from-pink-500 to-rose-500">樱花粉</option>
                                </select>
                            </div>
                        </div>

                        <button id="persona-submit-btn" type="submit" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-700 hover:to-indigo-700 text-white text-sm font-semibold shadow-sm transition-all">
                            保存自定义角色
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: Settings & Diagnostics -->
    <div id="settings-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 backdrop-blur-xs p-4">
        <div class="bg-white dark:bg-dark-surface w-full max-w-lg max-h-[88vh] rounded-2xl shadow-2xl border border-slate-200 dark:border-dark-border flex flex-col overflow-hidden animate-fade-in-up">
            <div class="flex items-center justify-between px-6 py-4 border-b border-slate-200 dark:border-dark-border">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-violet-500"></i>
                    <h3 class="text-base font-bold text-slate-800 dark:text-white">对话参数与系统状态</h3>
                </div>
                <button id="settings-modal-close" type="button" class="w-8 h-8 rounded-lg text-slate-400 hover:bg-slate-100 dark:hover:bg-dark-card flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="p-6 overflow-y-auto space-y-5 scrollbar-custom">
                <div>
                    <div class="flex justify-between text-xs font-medium mb-1.5">
                        <span class="text-slate-600 dark:text-slate-300">采样温度 (Temperature)</span>
                        <span id="setting-temperature-val" class="text-violet-600 font-semibold">0.7</span>
                    </div>
                    <input id="setting-temperature" type="range" min="0" max="1.5" step="0.1" value="0.7" class="w-full accent-violet-600">
                    <p class="text-[11px] text-slate-400 mt-1">较低值回答更严谨稳定，较高值更有创意和发散性。</p>
                </div>

                <div>
                    <div class="flex justify-between text-xs font-medium mb-1.5">
                        <span class="text-slate-600 dark:text-slate-300">上下文记忆轮数 (Max Messages)</span>
                        <span id="setting-max-history-val" class="text-violet-600 font-semibold">20</span>
                    </div>
                    <input id="setting-max-history" type="range" min="0" max="40" step="2" value="20" class="w-full accent-violet-600">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-600 dark:text-slate-300 mb-1.5">当前会话系统提示词覆盖（可选）</label>
                    <textarea id="setting-system-prompt" rows="3" placeholder="留空则使用所选角色的默认 System Prompt" class="w-full px-3 py-2 text-xs rounded-xl bg-slate-50 dark:bg-dark-card border border-slate-200 dark:border-dark-border focus:border-violet-500 focus:outline-none resize-none"></textarea>
                </div>

                <div>
                    <div class="text-xs font-semibold text-slate-600 dark:text-slate-300 mb-2">服务提供商接入状态</div>
                    <div id="provider-diagnostics" class="grid grid-cols-2 gap-2 text-xs"></div>
                </div>

                <button id="settings-save-btn" type="button" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-700 hover:to-indigo-700 text-white text-sm font-semibold shadow-sm transition-all">
                    应用设置
                </button>
            </div>
        </div>
    </div>

    <!-- Modal: Image Lightbox -->
    <div id="lightbox-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/85 backdrop-blur-sm p-4">
        <div class="relative max-w-5xl max-h-[90vh] flex flex-col items-center">
            <div class="absolute -top-11 right-0 flex items-center gap-2">
                <a id="lightbox-download" href="#" download class="px-3 py-1.5 rounded-lg bg-white/15 hover:bg-white/25 text-white text-xs flex items-center gap-1.5 transition-colors">
                    <i class="fa-solid fa-download"></i>
                    <span>下载原图</span>
                </a>
                <button id="lightbox-close" type="button" class="w-8 h-8 rounded-lg bg-white/15 hover:bg-white/25 text-white flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <img id="lightbox-img" src="" alt="预览图片" class="max-w-full max-h-[82vh] rounded-xl shadow-2xl object-contain">
            <p id="lightbox-caption" class="mt-3 text-xs text-slate-300 text-center max-w-2xl"></p>
        </div>
    </div>

    <script type="module" src="/static/js/app.js"></script>
</body>
</html>
