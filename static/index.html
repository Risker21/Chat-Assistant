<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpg" href="../img/favicon.jpg">
    <title>智能聊天机器人</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.5/purify.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        },
                        dark: {
                            bg: '#0f0f1a',
                            card: '#1a1a2e',
                            border: '#2d2d44',
                            text: '#e4e4e7'
                        },
                        gradient: {
                            'chat': 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                            'hero': 'linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%)',
                            'hero-dark': 'linear-gradient(135deg, #1a1a2e 0%, #16213e 100%)',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
                    },
                    boxShadow: {
                        'glow': '0 0 20px rgba(99, 102, 241, 0.3)',
                        'glow-lg': '0 0 40px rgba(99, 102, 241, 0.2)',
                        'float': '0 10px 40px -10px rgba(0, 0, 0, 0.15)',
                    },
                    animation: {
                        'float': 'float 3s ease-in-out infinite',
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'gradient': 'gradient 8s ease infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        gradient: {
                            '0%, 100%': { backgroundPosition: '0% 50%' },
                            '50%': { backgroundPosition: '100% 50%' },
                        }
                    }
                },
            }
        }
    </script>
    
    <style type="text/tailwindcss">
        @layer utilities {
            .scrollbar-hide {
                -ms-overflow-style: none;
                scrollbar-width: none;
            }
            .scrollbar-hide::-webkit-scrollbar {
                display: none;
            }
            .scrollbar-custom::-webkit-scrollbar {
                width: 6px;
            }
            .scrollbar-custom::-webkit-scrollbar-track {
                background: transparent;
            }
            .scrollbar-custom::-webkit-scrollbar-thumb {
                background: #d1d5db;
                border-radius: 3px;
            }
            .dark .scrollbar-custom::-webkit-scrollbar-thumb {
                background: #4b5563;
            }
            .markdown-body pre {
                @apply bg-gray-800 text-gray-100 rounded-xl p-4 my-4 overflow-x-auto;
            }
            .markdown-body code:not(pre code) {
                @apply bg-gray-100 dark:bg-gray-700 text-violet-500 dark:text-violet-400 px-1.5 py-0.5 rounded text-sm font-mono;
            }
            .markdown-body p {
                @apply mb-3 last:mb-0 leading-relaxed;
            }
            .markdown-body ul {
                @apply list-disc list-inside mb-3 space-y-1;
            }
            .markdown-body ol {
                @apply list-decimal list-inside mb-3 space-y-1;
            }
            .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 {
                @apply font-bold mt-6 mb-3;
            }
            .markdown-body h1 { @apply text-2xl border-b pb-2 dark:border-gray-700; }
            .markdown-body h2 { @apply text-xl border-b pb-2 dark:border-gray-700; }
            .markdown-body h3 { @apply text-lg; }
            .markdown-body a {
                @apply text-blue-500 hover:underline;
            }
            .markdown-body blockquote {
                @apply border-l-4 border-violet-400 dark:border-violet-600 pl-4 py-1 text-gray-600 dark:text-gray-400 italic my-4 bg-gray-50 dark:bg-gray-800/50 rounded-r-lg;
            }
            .markdown-body table {
                @apply w-full border-collapse mb-4;
            }
            .markdown-body th, .markdown-body td {
                @apply border border-gray-200 dark:border-gray-700 px-4 py-2 text-left;
            }
            .markdown-body th {
                @apply bg-gray-100 dark:bg-gray-700 font-semibold;
            }
            
            .typing-dot {
                animation: typing 1.4s infinite ease-in-out both;
            }
            .typing-dot:nth-child(1) { animation-delay: -0.32s; }
            .typing-dot:nth-child(2) { animation-delay: -0.16s; }
            @keyframes typing {
                0%, 80%, 100% { transform: scale(0); opacity: 0.5; }
                40% { transform: scale(1); opacity: 1; }
            }

            @keyframes fade-in-up {
                from {
                    opacity: 0;
                    transform: translateY(20px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            .animate-fade-in-up {
                animation: fade-in-up 0.4s ease-out forwards;
            }

            @keyframes shimmer {
                0% { background-position: -200% 0; }
                100% { background-position: 200% 0; }
            }
            .shimmer {
                background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.4) 50%, transparent 100%);
                background-size: 200% 100%;
                animation: shimmer 2s infinite;
            }

            .glass {
                background: rgba(255, 255, 255, 0.8);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
            }
            .dark .glass {
                background: rgba(26, 26, 46, 0.8);
            }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-50 to-violet-50 dark:from-dark-bg dark:to-violet-950/30 text-gray-800 dark:text-dark-text min-h-screen flex flex-col transition-colors duration-500">
    
    <!-- 背景装饰 -->
    <div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
        <div class="absolute top-0 left-1/4 w-96 h-96 bg-violet-400/20 dark:bg-violet-600/10 rounded-full blur-3xl animate-pulse-slow"></div>
        <div class="absolute bottom-1/4 right-1/4 w-80 h-80 bg-blue-400/20 dark:bg-blue-600/10 rounded-full blur-3xl animate-pulse-slow" style="animation-delay: 1s;"></div>
        <div class="absolute top-1/2 right-1/3 w-64 h-64 bg-pink-400/15 dark:bg-pink-600/10 rounded-full blur-3xl animate-pulse-slow" style="animation-delay: 2s;"></div>
    </div>
    
    <!-- 顶部导航栏 -->
    <header class="glass sticky top-0 z-50 border-b border-gray-200/50 dark:border-dark-border/50 transition-all duration-300">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="relative">
                    <div class="w-11 h-11 bg-gradient-to-br from-violet-500 via-purple-500 to-indigo-600 rounded-xl flex items-center justify-center shadow-lg shadow-violet-500/30">
                        <i class="fa-solid fa-robot text-white text-xl"></i>
                    </div>
                </div>
                <div class="hidden sm:block">
                    <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-violet-600 to-indigo-600 dark:from-violet-400 dark:to-indigo-400 tracking-tight">
                        AI 智能助手
                    </h1>
                    <p class="text-xs text-gray-500 dark:text-gray-400 -mt-0.5">随时为您效劳</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-2 sm:space-x-4">
                <div class="relative group">
                    <div class="flex items-center bg-white dark:bg-dark-card rounded-xl px-3 py-1.5 border border-gray-200 dark:border-dark-border shadow-sm hover:shadow-md transition-all duration-200">
                        <div class="pl-2 pr-3 py-1 text-sm font-medium text-gray-500 dark:text-gray-400">
                            <i class="fa-solid fa-wand-magic-sparkles mr-1.5 text-violet-500"></i>
                        </div>
                        <select id="model-select" class="appearance-none bg-transparent font-semibold text-gray-800 dark:text-white pl-1 pr-7 py-1.5 focus:outline-none cursor-pointer text-sm rounded-lg">
                            <option value="deepseek" class="text-gray-900">Ethan</option>
                            <option value="qwen" class="text-gray-900">Luna</option>
                            <option value="glm" class="text-gray-900">Felix</option>
                            <option value="hunyuan" class="text-gray-900">Zoe</option>
                        </select>
                        <i class="fa-solid fa-chevron-down absolute right-3 text-xs text-gray-400 pointer-events-none"></i>
                    </div>
                    
                    <div class="absolute top-full right-0 mt-3 w-72 bg-white dark:bg-dark-card rounded-2xl shadow-2xl border border-gray-100 dark:border-dark-border/50 p-5 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-300 transform origin-top-right scale-95 group-hover:scale-100 z-50">
                        <div class="flex items-center space-x-3 mb-3">
                            <div id="model-icon-bg" class="w-10 h-10 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-xl flex items-center justify-center shadow-md">
                                <i id="model-icon" class="fa-solid fa-square-root-variable text-white"></i>
                            </div>
                            <div>
                                <h4 id="model-title" class="font-bold text-gray-900 dark:text-white">Ethan</h4>
                                <p class="text-xs text-violet-500 font-medium">在线</p>
                            </div>
                        </div>
                        <p id="model-description" class="text-sm text-gray-500 dark:text-gray-400 leading-relaxed">
                            数学大师：精通各种数学问题，包括代数、几何、微积分等各个领域。
                        </p>
                    </div>
                </div>
                
                <div class="flex items-center space-x-1 border-l border-gray-200 dark:border-gray-700 pl-2 sm:pl-4">
                    <button id="theme-toggle" class="w-10 h-10 rounded-xl flex items-center justify-center text-gray-500 hover:text-violet-600 dark:text-gray-400 dark:hover:text-violet-400 hover:bg-white dark:hover:bg-dark-card shadow-sm hover:shadow-md transition-all duration-200" title="切换主题">
                        <i class="fa-solid fa-moon text-lg"></i>
                    </button>
                    <button id="clear-chat" class="w-10 h-10 rounded-xl flex items-center justify-center text-gray-500 hover:text-rose-600 dark:text-gray-400 dark:hover:text-rose-400 hover:bg-white dark:hover:bg-dark-card shadow-sm hover:shadow-md transition-all duration-200" title="清除对话">
                        <i class="fa-solid fa-trash-can text-lg"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- 主要聊天区域 -->
    <main class="flex-grow flex flex-col relative w-full max-w-4xl mx-auto">
        <div id="toast-container" class="fixed top-20 left-1/2 transform -translate-x-1/2 z-50 flex flex-col gap-2 pointer-events-none"></div>
        
        <button id="scroll-bottom-btn" class="absolute bottom-28 right-4 sm:right-6 w-12 h-12 bg-white dark:bg-dark-card rounded-full shadow-lg border border-gray-200 dark:border-dark-border flex items-center justify-center text-violet-500 hover:text-violet-600 hover:scale-110 transition-all opacity-0 invisible z-20">
            <i class="fa-solid fa-arrow-down text-lg"></i>
        </button>

        <!-- 聊天历史 -->
        <div id="chat-history" class="flex-grow overflow-y-auto px-4 py-8 space-y-6 scroll-smooth scrollbar-custom">
            
            <!-- 欢迎界面 -->
            <div id="welcome-screen" class="flex flex-col items-center justify-center min-h-[60vh] text-center px-4">
                <div class="relative mb-8">
                    <div class="w-24 h-24 bg-gradient-to-br from-violet-500 via-purple-500 to-indigo-600 rounded-3xl flex items-center justify-center shadow-2xl shadow-violet-500/30">
                        <i class="fa-solid fa-robot text-white text-4xl"></i>
                    </div>
                </div>
                
                <h2 class="text-3xl font-bold mb-3 bg-clip-text text-transparent bg-gradient-to-r from-violet-600 to-indigo-600 dark:from-violet-400 dark:to-indigo-400">
                    你好，我是你的 AI 助手
                </h2>
                <p class="text-gray-500 dark:text-gray-400 max-w-lg mx-auto mb-10 text-base leading-relaxed">
                    我能帮你解答问题、编写代码、分析数据，或者进行随意的闲聊。试试下方推荐，开启智能对话之旅吧！
                </p>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 w-full max-w-3xl">
                    <button class="suggestion-btn group text-left p-5 rounded-2xl bg-white dark:bg-dark-card border border-gray-100 dark:border-dark-border hover:border-violet-400 dark:hover:border-violet-500 shadow-sm hover:shadow-xl hover:shadow-violet-500/10 transition-all duration-300 transform hover:-translate-y-1">
                        <div class="flex items-center space-x-3 mb-2">
                            <div class="w-10 h-10 bg-blue-100 dark:bg-blue-900/30 rounded-xl flex items-center justify-center group-hover:scale-110 transition-transform">
                                <i class="fa-solid fa-code text-blue-500"></i>
                            </div>
                            <span class="font-bold text-gray-800 dark:text-gray-200 group-hover:text-violet-600 dark:group-hover:text-violet-400 transition-colors">编写代码</span>
                        </div>
                        <p class="text-sm text-gray-500 dark:text-gray-400 pl-[3.25rem]">帮我写一个用 Python 实现的快速排序算法</p>
                    </button>
                    
                    <button class="suggestion-btn group text-left p-5 rounded-2xl bg-white dark:bg-dark-card border border-gray-100 dark:border-dark-border hover:border-violet-400 dark:hover:border-violet-500 shadow-sm hover:shadow-xl hover:shadow-violet-500/10 transition-all duration-300 transform hover:-translate-y-1">
                        <div class="flex items-center space-x-3 mb-2">
                            <div class="w-10 h-10 bg-emerald-100 dark:bg-emerald-900/30 rounded-xl flex items-center justify-center group-hover:scale-110 transition-transform">
                                <i class="fa-solid fa-calculator text-emerald-500"></i>
                            </div>
                            <span class="font-bold text-gray-800 dark:text-gray-200 group-hover:text-violet-600 dark:group-hover:text-violet-400 transition-colors">解答数学题</span>
                        </div>
                        <p class="text-sm text-gray-500 dark:text-gray-400 pl-[3.25rem]">解释一下什么是微积分中的极限概念</p>
                    </button>
                    
                    <button class="suggestion-btn group text-left p-5 rounded-2xl bg-white dark:bg-dark-card border border-gray-100 dark:border-dark-border hover:border-violet-400 dark:hover:border-violet-500 shadow-sm hover:shadow-xl hover:shadow-violet-500/10 transition-all duration-300 transform hover:-translate-y-1">
                        <div class="flex items-center space-x-3 mb-2">
                            <div class="w-10 h-10 bg-pink-100 dark:bg-pink-900/30 rounded-xl flex items-center justify-center group-hover:scale-110 transition-transform">
                                <i class="fa-solid fa-heart text-pink-500"></i>
                            </div>
                            <span class="font-bold text-gray-800 dark:text-gray-200 group-hover:text-violet-600 dark:group-hover:text-violet-400 transition-colors">情感咨询</span>
                        </div>
                        <p class="text-sm text-gray-500 dark:text-gray-400 pl-[3.25rem]">我最近工作压力很大，感到很焦虑怎么办？</p>
                    </button>
                    
                    <button class="suggestion-btn group text-left p-5 rounded-2xl bg-white dark:bg-dark-card border border-gray-100 dark:border-dark-border hover:border-violet-400 dark:hover:border-violet-500 shadow-sm hover:shadow-xl hover:shadow-violet-500/10 transition-all duration-300 transform hover:-translate-y-1">
                        <div class="flex items-center space-x-3 mb-2">
                            <div class="w-10 h-10 bg-amber-100 dark:bg-amber-900/30 rounded-xl flex items-center justify-center group-hover:scale-110 transition-transform">
                                <i class="fa-solid fa-yin-yang text-amber-500"></i>
                            </div>
                            <span class="font-bold text-gray-800 dark:text-gray-200 group-hover:text-violet-600 dark:group-hover:text-violet-400 transition-colors">占卜运势</span>
                        </div>
                        <p class="text-sm text-gray-500 dark:text-gray-400 pl-[3.25rem]">帮我算一卦，看看最近的财运如何</p>
                    </button>
                </div>
            </div>

        </div>

        <!-- 底部输入区域 -->
        <div class="p-4 sm:p-6 bg-gradient-to-t from-gray-50/80 to-transparent dark:from-dark-bg/80 backdrop-blur-sm">
            <div class="max-w-4xl mx-auto relative">
                <form id="chat-form" class="relative bg-white dark:bg-dark-card rounded-3xl shadow-xl dark:shadow-2xl dark:shadow-violet-500/5 border border-gray-200 dark:border-dark-border/50 flex flex-col transition-all duration-300 focus-within:ring-2 focus-within:ring-violet-500/50 focus-within:border-violet-400">
                    <textarea id="message-input" rows="1" placeholder="输入消息..." 
                           class="w-full bg-transparent px-6 py-4 max-h-40 min-h-[60px] resize-none focus:outline-none text-gray-800 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500 scrollbar-hide text-base leading-relaxed"
                           style="overflow-y: hidden;"></textarea>
                    
                    <div class="flex justify-between items-center px-4 pb-4 pt-1">
                        <div class="text-xs text-gray-400 dark:text-gray-500 pl-2 hidden sm:flex items-center space-x-1">
                            <span class="bg-gray-100 dark:bg-gray-800 px-2 py-1 rounded-lg text-[10px] border border-gray-200 dark:border-gray-700">Enter</span>
                            <span>发送</span>
                            <span class="mx-1 opacity-40">|</span>
                            <span class="bg-gray-100 dark:bg-gray-800 px-2 py-1 rounded-lg text-[10px] border border-gray-200 dark:border-gray-700">Shift + Enter</span>
                            <span>换行</span>
                        </div>
                        <button type="button" id="stop-btn" class="hidden w-11 h-11 rounded-xl bg-rose-50 hover:bg-rose-100 dark:bg-rose-900/20 dark:hover:bg-rose-900/40 text-rose-500 flex items-center justify-center transition-all duration-300 ml-auto border border-rose-200 dark:border-rose-800/50 hover:scale-105" title="停止生成">
                            <i class="fa-solid fa-stop text-sm"></i>
                        </button>
                        <button type="submit" id="send-btn" class="w-11 h-11 rounded-xl bg-gradient-to-br from-violet-500 to-indigo-600 hover:from-violet-600 hover:to-indigo-700 text-white flex items-center justify-center transition-all duration-300 disabled:opacity-40 disabled:cursor-not-allowed shadow-lg shadow-violet-500/30 disabled:shadow-none ml-auto transform active:scale-95 hover:scale-105 disabled:hover:scale-100">
                            <i class="fa-solid fa-paper-plane text-sm"></i>
                        </button>
                    </div>
                </form>
                <div class="text-center mt-4 text-[11px] text-gray-400 dark:text-gray-500 flex items-center justify-center space-x-1">
                    <i class="fa-solid fa-shield-halved"></i>
                    <span>AI 可能会产生不准确的信息，请仔细核查。</span>
                </div>
            </div>
        </div>
    </main>

    <script>
        marked.setOptions({
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    try {
                        return hljs.highlight(code, { language: lang }).value;
                    } catch (__) {}
                }
                return hljs.highlightAuto(code).value;
            },
            breaks: true,
            gfm: true
        });

        const chatHistory = document.getElementById('chat-history');
        const messageInput = document.getElementById('message-input');
        const chatForm = document.getElementById('chat-form');
        const sendBtn = document.getElementById('send-btn');
        const stopBtn = document.getElementById('stop-btn');
        const clearChatBtn = document.getElementById('clear-chat');
        const themeToggleBtn = document.getElementById('theme-toggle');
        const modelSelect = document.getElementById('model-select');
        const modelDescription = document.getElementById('model-description');
        const modelTitle = document.getElementById('model-title');
        const modelIcon = document.getElementById('model-icon');
        const modelIconBg = document.getElementById('model-icon-bg');
        const welcomeScreen = document.getElementById('welcome-screen');
        const suggestionBtns = document.querySelectorAll('.suggestion-btn');
        const toastContainer = document.getElementById('toast-container');
        const scrollBottomBtn = document.getElementById('scroll-bottom-btn');
        
        const modelInfos = {
            'deepseek': {
                title: '数学天才',
                desc: '数学大师：精通各种数学问题，包括代数、几何、微积分等各个领域。',
                bg: 'bg-gradient-to-br from-blue-500 to-indigo-600',
                icon: 'fa-square-root-variable'
            },
            'qwen': {
                title: '疗愈情感',
                desc: '情感老师：擅长倾听和分析情感问题，给予温暖、专业的情感建议和心理支持。',
                bg: 'bg-gradient-to-br from-pink-500 to-rose-500',
                icon: 'fa-heart'
            },
            'glm': {
                title: '算卦大师',
                desc: '精通周易、占卜等传统预测术，给出富有洞察力的占卜结果和建议。',
                bg: 'bg-gradient-to-br from-emerald-500 to-teal-600',
                icon: 'fa-yin-yang'
            },
            'hunyuan': {
                title: '暖心搭子',
                desc: '聊天打字专家：擅长日常聊天和交流，能够自然、流畅地与用户进行对话。',
                bg: 'bg-gradient-to-br from-amber-500 to-orange-500',
                icon: 'fa-comments'
            }
        };

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            const icon = type === 'success' ? 'fa-circle-check text-green-500' : 'fa-circle-exclamation text-red-500';
            toast.className = `bg-white dark:bg-dark-card border border-gray-200 dark:border-gray-700 shadow-xl rounded-2xl px-5 py-3 flex items-center space-x-3 animate-fade-in-up transition-opacity duration-300`;
            toast.innerHTML = `
                <i class="fa-solid ${icon} text-lg"></i>
                <span class="text-sm font-medium text-gray-700 dark:text-gray-200">${message}</span>
            `;
            toastContainer.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.add('opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }

        async function copyToClipboard(encodedText, btnElement) {
            try {
                const txt = document.createElement("textarea");
                txt.innerHTML = encodedText;
                const text = txt.value;
                
                await navigator.clipboard.writeText(text);
                showToast('已复制到剪贴板');
                
                const icon = btnElement.querySelector('i');
                const oldClass = icon.className;
                icon.className = 'fa-solid fa-check text-green-500';
                setTimeout(() => { icon.className = oldClass; }, 2000);
            } catch (err) {
                showToast('复制失败', 'error');
            }
        }

        chatHistory.addEventListener('scroll', () => {
            const distanceToBottom = chatHistory.scrollHeight - chatHistory.scrollTop - chatHistory.clientHeight;
            if (distanceToBottom > 150) {
                scrollBottomBtn.classList.remove('opacity-0', 'invisible');
                scrollBottomBtn.classList.add('opacity-100', 'visible');
            } else {
                scrollBottomBtn.classList.add('opacity-0', 'invisible');
                scrollBottomBtn.classList.remove('opacity-100', 'visible');
            }
        });

        scrollBottomBtn.addEventListener('click', scrollToBottom);

        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            if(this.value.trim() === '') {
                sendBtn.disabled = true;
                sendBtn.classList.add('opacity-40');
            } else {
                sendBtn.disabled = false;
                sendBtn.classList.remove('opacity-40');
            }
        });

        sendBtn.disabled = true;

        suggestionBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const text = btn.querySelector('p').textContent;
                messageInput.value = text;
                messageInput.dispatchEvent(new Event('input'));
                messageInput.focus();
            });
        });

        let currentAbortController = null;
        let isTyping = false;

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = messageInput.value.trim();
            if (!message) return;

            if (welcomeScreen && welcomeScreen.style.display !== 'none') {
                welcomeScreen.style.display = 'none';
            }

            messageInput.value = '';
            messageInput.style.height = 'auto';
            sendBtn.classList.add('hidden');
            stopBtn.classList.remove('hidden');
            messageInput.disabled = true;

            addMessageToHistory('user', message);

            const loadingId = addLoadingMessage();
            
            currentAbortController = new AbortController();

            try {
                const selectedModel = modelSelect.value;
                
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message, model: selectedModel }),
                    signal: currentAbortController.signal
                });

                if (!response.ok) throw new Error('网络请求失败');

                const data = await response.json();
                
                removeLoadingMessage(loadingId);
                addMessageToHistory('bot', data.response, true);
                
            } catch (error) {
                console.error('错误:', error);
                removeLoadingMessage(loadingId);
                
                if (error.name === 'AbortError') {
                    showToast('已停止生成', 'success');
                    resetInputState();
                } else {
                    addMessageToHistory('bot', '抱歉，连接服务器失败。请检查后端服务是否正常运行。', false, true);
                    resetInputState();
                }
            }
        });

        stopBtn.addEventListener('click', () => {
            if (currentAbortController) {
                currentAbortController.abort();
            }
            if (isTyping) {
                isTyping = false;
            }
            resetInputState();
        });

        function resetInputState() {
            sendBtn.classList.remove('hidden');
            stopBtn.classList.add('hidden');
            messageInput.disabled = false;
            sendBtn.disabled = messageInput.value.trim() === '';
            messageInput.focus();
        }

        function parseMarkdown(text) {
            const rawHtml = marked.parse(text);
            return DOMPurify.sanitize(rawHtml);
        }

        function addMessageToHistory(sender, message, useTypeWriter = false, isError = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'flex w-full animate-fade-in-up group';
            
            if (sender === 'bot') {
                const modelInfo = modelInfos[modelSelect.value];
                const avatarBg = isError ? 'bg-gradient-to-br from-rose-500 to-red-600' : modelInfo.bg;
                const avatarIcon = isError ? 'fa-triangle-exclamation' : modelInfo.icon;
                
                const escapedMessage = message.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                
                messageDiv.innerHTML = `
                    <div class="flex max-w-3xl w-full">
                        <div class="flex-shrink-0 mr-4">
                            <div class="w-10 h-10 ${avatarBg} rounded-2xl flex items-center justify-center shadow-lg text-white transform hover:scale-110 transition-transform duration-200">
                                <i class="fa-solid ${avatarIcon} text-sm"></i>
                            </div>
                        </div>
                        <div class="flex-grow min-w-0 pt-1 relative">
                            <div class="text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2 flex items-center justify-between">
                                <span class="flex items-center space-x-2">
                                    <span>${modelInfo.title}</span>
                                    <span class="w-1.5 h-1.5 bg-green-400 rounded-full animate-pulse"></span>
                                </span>
                                <button data-clipboard-text="${escapedMessage}" onclick="copyToClipboard(this.getAttribute('data-clipboard-text'), this)" class="opacity-0 group-hover:opacity-100 text-gray-400 hover:text-violet-600 dark:hover:text-violet-400 transition-all p-2 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-800" title="复制回答">
                                    <i class="fa-regular fa-copy text-sm"></i>
                                </button>
                            </div>
                            <div class="bg-white dark:bg-dark-card rounded-2xl rounded-tl-sm px-5 py-4 shadow-sm border border-gray-100 dark:border-dark-border/50 message-content markdown-body text-gray-800 dark:text-gray-200" ${useTypeWriter ? 'style="opacity: 0"' : ''}>
                                ${useTypeWriter ? '' : parseMarkdown(message)}
                            </div>
                        </div>
                    </div>
                `;
            } else {
                messageDiv.innerHTML = `
                    <div class="flex max-w-3xl w-full justify-end ml-auto">
                        <div class="flex-grow min-w-0 pt-1 mr-4 flex flex-col items-end">
                            <div class="text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2 text-right">你</div>
                            <div class="bg-gradient-to-br from-violet-500 to-indigo-600 text-white px-6 py-4 rounded-2xl rounded-tr-sm shadow-lg shadow-violet-500/20 break-words max-w-full text-[15px] leading-relaxed transition-transform hover:scale-[1.02]">
                                ${message.replace(/\n/g, '<br>')}
                            </div>
                        </div>
                        <div class="flex-shrink-0">
                            <div class="w-10 h-10 bg-gradient-to-br from-gray-200 to-gray-300 dark:from-gray-600 dark:to-gray-700 rounded-2xl flex items-center justify-center shadow-md">
                                <i class="fa-solid fa-user text-gray-600 dark:text-gray-300 text-sm"></i>
                            </div>
                        </div>
                    </div>
                `;
            }

            chatHistory.appendChild(messageDiv);
            scrollToBottom();

            if (sender === 'bot' && useTypeWriter) {
                const contentDiv = messageDiv.querySelector('.message-content');
                contentDiv.style.opacity = '1';
                
                const parsedHtml = parseMarkdown(message);
                contentDiv.innerHTML = '';
                
                let i = 0;
                let isTag = false;
                let text = '';
                isTyping = true;
                
                function typeWriter() {
                    if (!isTyping || i >= parsedHtml.length) {
                        isTyping = false;
                        resetInputState();
                        contentDiv.querySelectorAll('pre code').forEach((block) => {
                            hljs.highlightElement(block);
                        });
                        scrollToBottom();
                        return;
                    }
                    
                    if (i < parsedHtml.length) {
                        text += parsedHtml.charAt(i);
                        contentDiv.innerHTML = text;
                        
                        if (parsedHtml.charAt(i) === '<') isTag = true;
                        if (parsedHtml.charAt(i) === '>') isTag = false;
                        
                        i++;
                        
                        const distanceToBottom = chatHistory.scrollHeight - chatHistory.scrollTop - chatHistory.clientHeight;
                        if (distanceToBottom < 50) {
                            scrollToBottom();
                        }
                        
                        if (isTag) {
                            typeWriter();
                        } else {
                            setTimeout(typeWriter, 15);
                        }
                    }
                }
                
                typeWriter();
            } else if (sender === 'bot') {
                resetInputState();
            }
        }

        function addLoadingMessage() {
            const loadingId = `loading-${Date.now()}`;
            const loadingDiv = document.createElement('div');
            loadingDiv.id = loadingId;
            loadingDiv.className = 'flex w-full animate-fade-in-up';
            
            const modelInfo = modelInfos[modelSelect.value];
            
            loadingDiv.innerHTML = `
                <div class="flex max-w-3xl w-full">
                    <div class="flex-shrink-0 mr-4">
                        <div class="w-10 h-10 ${modelInfo.bg} rounded-2xl flex items-center justify-center shadow-lg text-white">
                            <i class="fa-solid ${modelInfo.icon} text-sm"></i>
                        </div>
                    </div>
                    <div class="flex-grow min-w-0 pt-2">
                        <div class="text-sm font-semibold text-gray-700 dark:text-gray-300 mb-3">
                            ${modelInfo.title} <span class="text-xs font-normal text-gray-400">正在思考...</span>
                        </div>
                        <div class="bg-white dark:bg-dark-card rounded-2xl rounded-tl-sm px-5 py-4 shadow-sm border border-gray-100 dark:border-dark-border/50 inline-flex space-x-2 items-center">
                            <div class="w-2.5 h-2.5 bg-violet-400 rounded-full typing-dot"></div>
                            <div class="w-2.5 h-2.5 bg-violet-400 rounded-full typing-dot"></div>
                            <div class="w-2.5 h-2.5 bg-violet-400 rounded-full typing-dot"></div>
                        </div>
                    </div>
                </div>
            `;

            chatHistory.appendChild(loadingDiv);
            scrollToBottom();
            return loadingId;
        }

        function removeLoadingMessage(loadingId) {
            const loadingDiv = document.getElementById(loadingId);
            if (loadingDiv) loadingDiv.remove();
        }

        function scrollToBottom() {
            chatHistory.scrollTo({
                top: chatHistory.scrollHeight,
                behavior: 'smooth'
            });
        }

        clearChatBtn.addEventListener('click', () => {
            if (confirm('确定要清除所有对话记录吗？')) {
                Array.from(chatHistory.children).forEach(child => {
                    if (child.id !== 'welcome-screen') {
                        child.remove();
                    }
                });
                welcomeScreen.style.display = 'flex';
                welcomeScreen.classList.remove('hidden');
            }
        });

        modelSelect.addEventListener('change', () => {
            const info = modelInfos[modelSelect.value];
            modelTitle.textContent = info.title;
            modelDescription.textContent = info.desc;
            modelIcon.className = `fa-solid ${info.icon}`;
            modelIconBg.className = `${info.bg} rounded-xl flex items-center justify-center shadow-md`;
            showToast(`已切换至 ${info.title}`);
        });

        const html = document.documentElement;
        
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            html.classList.add('dark');
            updateThemeIcon(true);
        } else {
            html.classList.remove('dark');
            updateThemeIcon(false);
        }

        themeToggleBtn.addEventListener('click', () => {
            html.classList.toggle('dark');
            const isDark = html.classList.contains('dark');
            
            if (isDark) {
                localStorage.theme = 'dark';
            } else {
                localStorage.theme = 'light';
            }
            
            updateThemeIcon(isDark);
        });

        function updateThemeIcon(isDark) {
            const icon = themeToggleBtn.querySelector('i');
            if (isDark) {
                icon.className = 'fa-solid fa-sun text-lg text-amber-400';
            } else {
                icon.className = 'fa-solid fa-moon text-lg';
            }
        }

        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if (!sendBtn.disabled) {
                    chatForm.dispatchEvent(new Event('submit'));
                }
            }
        });
    </script>
</body>
</html>
