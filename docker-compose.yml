services:
  chat-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chat-assistant
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: sqlite:////app/data/chat_assistant.db
    volumes:
      - chat_data:/app/data

volumes:
  chat_data:
